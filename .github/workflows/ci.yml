name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 代码块承诺"都能编译运行"，这一条是所有门禁里最硬的一条
      - name: 编译并运行所有 cpp 代码块
        run: node scripts/verify-code.mjs

      # 注册表 / 结构 / 命名 / 术语 四类一致性
      - name: 文档一致性检查
        run: node scripts/check-consistency.mjs

      # 死链、容器语法、Vue 组件在构建阶段就会炸
      - name: 构建站点
        run: npm run build
